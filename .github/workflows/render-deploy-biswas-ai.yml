name: Render deploy (biswas-ai)

# Render's own auto-deploy on commit does not fire for this repo, so this workflow
# calls the service's Deploy Hook and then waits until /healthz shows the new version.
on:
  push:
    branches: [main]
    paths:
      - "biswas-ai/**"
      - ".github/workflows/render-deploy-biswas-ai.yml"
  workflow_dispatch:

concurrency:
  group: render-deploy-biswas-ai
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Read expected version
        id: ver
        run: |
          v=$(grep -oE 'end\("ok v[0-9]+"\)' biswas-ai/server.js | grep -oE 'v[0-9]+' | head -1)
          if [ -z "$v" ]; then echo "::error::Could not read version from biswas-ai/server.js"; exit 1; fi
          echo "Expected version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy hook
        id: hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null
          echo "Deploy hook called."

      - name: Wait for live /healthz to report ${{ steps.ver.outputs.version }}
        if: steps.hook.outputs.skip != 'true'
        env:
          WANT: ok ${{ steps.ver.outputs.version }}
        run: |
          url=https://biswas-ai-for-office.onrender.com/healthz
          end=$(( $(date +%s) + 480 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            got=$(curl -s -m 20 "$url" || true)
            echo "$(date -u +%H:%M:%S) healthz: ${got:-<no response>}"
            if [ "$got" = "$WANT" ]; then echo "Live and serving $WANT"; exit 0; fi
            sleep 15
          done
          echo "::error::Live site never reported '$WANT' within 8 minutes"
          exit 1
