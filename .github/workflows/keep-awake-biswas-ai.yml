name: Keep Biswas AI awake

# Render's free plan puts the service to sleep after inactivity, so the next
# visitor waits ~50 s. A ping every 10 minutes keeps it warm. Note: one always-on
# free service uses about 744 of Render's 750 free instance hours a month.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake-biswas-ai
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        continue-on-error: true
        run: |
          curl -sS --retry 3 --retry-delay 5 --retry-all-errors --max-time 60 \
            -o /dev/null -w "healthz HTTP %{http_code} in %{time_total}s\n" \
            https://biswas-ai-for-office.onrender.com/healthz || echo "::warning::healthz ping failed (service may be waking up)"
