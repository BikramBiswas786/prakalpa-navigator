<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biswas AI for Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Serif:wght@400;700&family=Noto+Serif+Bengali:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen chat tool. Header with mode switch; desktop gets a left rail of
   ready tasks; the conversation column holds answers set like office paper. */
:root {
  --paper: #f3f4f8;
  --surface: #ffffff;
  --sheet: #fffefb;
  --ink: #1c2233;
  --muted: #5a6276;
  --line: #d8dbe5;
  --accent: #3f3297;       /* stamp-pad violet */
  --accent-ink: #ffffff;
  --accent-soft: #ebe9f8;
  --user: #e7e5f7;
  --ok: #1d7448; --ok-soft: #e3f3ea;
  --warn: #965400; --warn-soft: #fbefdc;
  --bad: #ad261d; --bad-soft: #fbe5e3;
  --f-display: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  --f-body: "Noto Sans", "Noto Sans Bengali", system-ui, sans-serif;
  --f-doc: "Noto Serif", "Noto Serif Bengali", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12141b; --surface: #1a1d27; --sheet: #1f2230; --ink: #e5e7ef; --muted: #9ba2b5; --line: #2d3242;
    --accent: #a99df2; --accent-ink: #15122b; --accent-soft: #29254a; --user: #2a2650;
    --ok: #6fcf9b; --ok-soft: #173126; --warn: #e6ac57; --warn-soft: #362812; --bad: #f2948b; --bad-soft: #3a1c1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12141b; --surface: #1a1d27; --sheet: #1f2230; --ink: #e5e7ef; --muted: #9ba2b5; --line: #2d3242;
  --accent: #a99df2; --accent-ink: #15122b; --accent-soft: #29254a; --user: #2a2650;
  --ok: #6fcf9b; --ok-soft: #173126; --warn: #e6ac57; --warn-soft: #362812; --bad: #f2948b; --bad-soft: #3a1c1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.25; margin: 0; text-wrap: balance; }
a { color: var(--accent); }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand h1 { font-size: 1.35rem; color: var(--accent); }
.brand span { font-family: var(--f-display); font-weight: 600; color: var(--muted); font-size: .92rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-weight: 600; font-family: var(--f-display); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: .88rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 3px 9px; font-size: .8rem; font-weight: 600; }
.btn[disabled] { opacity: .5; cursor: default; }

.body { min-height: 0; display: grid; grid-template-columns: 270px minmax(0, 1fr); }
@media (max-width: 900px) { .body { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } }
.rail { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 16px; display: grid; align-content: start; gap: 18px; }
.rail h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin-bottom: 6px; }
.tasks { display: grid; gap: 4px; }
.task { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; cursor: pointer; display: grid; gap: 0; }
.task:hover { background: var(--accent-soft); }
.task b { font-family: var(--f-display); font-weight: 600; font-size: .98rem; }
.task small { color: var(--muted); font-size: .78rem; line-height: 1.35; }
.railnote { font-size: .8rem; color: var(--muted); line-height: 1.45; }
.railnote ul { margin: 4px 0 0; padding-left: 1rem; display: grid; gap: 3px; }
@media (max-width: 900px) { .rail { display: none; } }
.sample-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: .82rem; font-family: var(--f-display); }
.chip:hover { border-color: var(--accent); color: var(--accent); }

.chat { min-height: 0; display: grid; grid-template-rows: auto 1fr auto; }
.banner { margin: 10px auto 0; width: min(820px, 100%); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.banner div { font-size: .85rem; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; }
.banner { grid-row: 1; }
.scroll { grid-row: 2; overflow-y: auto; min-height: 0; }
.composer { grid-row: 3; }
.thread { width: min(820px, 100%); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 24px; display: grid; gap: 18px; }
.msg { display: grid; gap: 6px; min-width: 0; }
.msg.user { justify-items: end; }
.msg.user .bubble { background: var(--user); border-radius: 14px 14px 4px 14px; padding: 9px 14px; max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere; }
.files { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.file { font-size: .78rem; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 8px; }
.msg.ai .doc { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; min-width: 0; overflow-wrap: anywhere; }
.doc > :first-child { margin-top: 0; } .doc > :last-child { margin-bottom: 0; }
.doc p { margin: 0 0 10px; }
.doc h1, .doc h2, .doc h3, .doc h4 { margin: 14px 0 8px; font-size: 1.08rem; }
.doc h1 { font-size: 1.2rem; }
.doc ul, .doc ol { margin: 0 0 10px; padding-left: 1.5rem; }
.doc li { margin: 2px 0; }
.doc hr { border: 0; border-top: 1px dashed var(--line); margin: 14px 0; }
.doc code { font-family: var(--f-mono); font-size: .85em; background: var(--paper); padding: 0 4px; border-radius: 4px; }
.doc pre { background: var(--paper); padding: 10px; border-radius: 6px; overflow-x: auto; }
.doc .tbl { overflow-x: auto; margin: 0 0 10px; }
.doc table { border-collapse: collapse; font-size: .9rem; min-width: 60%; }
.doc th, .doc td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.doc th { background: var(--accent-soft); }
.thinking { color: var(--muted); font-style: italic; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.err { font-size: .85rem; color: var(--bad); }
.via { font-size: .72rem; color: var(--muted); }
.edit-area { width: 100%; min-height: 240px; border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--sheet); font: 14px/1.55 var(--f-mono); }

.welcome { display: grid; gap: 14px; padding-top: 12px; }
.welcome h2 { font-size: 1.6rem; }
.welcome p { color: var(--muted); margin: 0; max-width: 62ch; }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.starter { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.starter:hover { border-color: var(--accent); }
.starter b { font-family: var(--f-display); font-weight: 600; color: var(--accent); }
.starter span { font-size: .85rem; color: var(--muted); }
.mobile-tasks { display: none; }
@media (max-width: 900px) { .mobile-tasks { display: block; } }

.composer { background: var(--surface); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer .inner { width: min(820px, 100%); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
.pending { display: flex; gap: 6px; flex-wrap: wrap; }
.pending .file { display: inline-flex; gap: 6px; align-items: center; }
.pending .file button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0; }
.box { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: 12px; padding: 6px; background: var(--paper); }
.box textarea { flex: 1; min-width: 0; border: 0; background: none; resize: none; max-height: 200px; min-height: 40px; padding: 8px; outline: none; }
.iconbtn { border: 0; background: none; cursor: pointer; width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--accent-soft); color: var(--accent); }
.send { background: var(--accent); color: var(--accent-ink); }
.send:hover { background: var(--accent); color: var(--accent-ink); opacity: .9; }
.hint { font-size: .74rem; color: var(--muted); text-align: center; }

dialog { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); width: min(500px, calc(100vw - 32px)); padding: 20px; }
dialog::backdrop { background: rgba(10, 10, 30, .45); }
.form { display: grid; gap: 10px; }
.field { display: grid; gap: 3px; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 7px 9px; width: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: .88rem; z-index: 20; max-width: calc(100vw - 32px); }

/* A4 sheet handed to the PDF renderer */
.pdf-doc { width: 180mm; background: #fff; color: #000; font: 12pt/1.6 "Noto Serif", "Noto Serif Bengali", serif; padding: 0; }
.pdf-doc table { border-collapse: collapse; width: 100%; font-size: 10.5pt; }
.pdf-doc th, .pdf-doc td { border: 1px solid #555; padding: 4px 6px; text-align: left; vertical-align: top; }
.pdf-doc p { margin: 0 0 8pt; } .pdf-doc ul, .pdf-doc ol { margin: 0 0 8pt; padding-left: 18pt; }
.pdf-doc h1, .pdf-doc h2, .pdf-doc h3 { font-size: 13pt; margin: 8pt 0 6pt; }
.pdf-doc hr { border: 0; border-top: 1px solid #999; }
.pdf-doc .tbl { overflow: visible; }
/* ---- two sections: header, sub-tabs, page views ---- */
.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
.langbox { display: flex; align-items: center; gap: 8px; border: 2px solid var(--accent); border-radius: 10px; padding: 3px 4px 3px 10px; background: var(--accent-soft); }
.langbox > span { font-size: .78rem; font-weight: 600; color: var(--accent); white-space: nowrap; }
.langbox .seg { border-color: var(--accent); }
@media (max-width: 600px) { .langbox > span { display: none; } .langbox { padding: 2px; } }
#langpick { width: min(420px, calc(100vw - 32px)); text-align: center; }
#langpick .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
#langpick .choices button { padding: 22px 10px; font-size: 1.3rem; font-family: var(--f-display); font-weight: 700; }
.docard { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px; display: grid; gap: 8px; min-width: 0; }
.docard-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.docard .paper { min-height: 0; resize: none; box-shadow: none; padding: clamp(14px, 3vw, 32px); }
.bk-text { background: none; border: 0; padding: 0; }
.msg.ai.bk { gap: 10px; }
.learned { font-size: .78rem; color: var(--ok); background: var(--ok-soft); border-radius: 6px; padding: 4px 8px; }
#memory { width: min(640px, calc(100vw - 24px)); max-height: 90vh; }
.memlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; max-height: 32vh; overflow: auto; }
.memlist li { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: .88rem; }
.memlist li.lead { border: 0; }
.ver { font-family: var(--f-mono); font-size: .7rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; align-self: center; }
.subnav { background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.subnav::-webkit-scrollbar { display: none; }
.subnav button { border: 0; background: none; padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; color: var(--muted); font-weight: 600; font-family: var(--f-display); font-size: 1rem; }
.subnav button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.views { min-height: 0; position: relative; }
.view { height: 100%; }
.page { overflow-y: auto; }
.page-inner { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; display: grid; gap: 16px; }
.page-inner > h2 { font-size: 1.4rem; }
.lead { color: var(--muted); margin: 0; font-size: .9rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.field textarea { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 7px 9px; width: 100%; min-height: 110px; resize: vertical; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.status-line { font-size: .82rem; color: var(--muted); }
.chat.view { display: grid; grid-template-rows: auto 1fr auto; }
/* drafting desk */
.draft-grid { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .draft-grid { grid-template-columns: minmax(0, 1fr); } }
.paperwrap { display: grid; gap: 10px; min-width: 0; }
.paper { width: 100%; min-height: 62vh; background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: clamp(16px, 4vw, 44px); font: 15.5px/1.75 var(--f-doc); color: var(--ink); resize: vertical; box-shadow: 0 10px 30px -20px rgba(20, 20, 50, .45); }
.paper:focus { outline: 2px solid var(--accent-soft); }
textarea.paper { white-space: pre-wrap; }
.revise { display: flex; gap: 8px; flex-wrap: wrap; }
.revise input { flex: 1 1 240px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; }
.fmt-note { font-size: .8rem; color: var(--muted); }
.fmt-note button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font: inherit; text-decoration: underline; }
/* table maker */
.gridwrap { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); max-height: 60vh; }
#t-grid { border-collapse: collapse; min-width: 100%; font-size: .92rem; }
#t-grid td { border: 1px solid var(--line); padding: 6px 8px; min-width: 110px; vertical-align: top; outline: none; }
#t-grid td:focus { background: var(--accent-soft); }
#t-grid tr:first-child td { background: var(--accent-soft); font-weight: 600; }
#t-grid td.rh { min-width: 0; width: 1%; color: var(--muted); font-size: .75rem; text-align: center; background: var(--paper); font-weight: 400; user-select: none; }
/* file tools */
.toolgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.tool h3 { color: var(--accent); font-size: 1.08rem; }
.tool p { margin: 0; color: var(--muted); font-size: .86rem; }
.tool .picked { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
.tool textarea { width: 100%; min-height: 160px; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 8px; font: 13px/1.5 var(--f-body); }
/* catalogue */
.c-top { display: grid; gap: 10px; }
.c-top input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 14px; width: 100%; font-size: 1rem; }
.cat-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cat-chips .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; cursor: pointer; display: grid; gap: 6px; align-content: start; color: var(--ink); }
.card:hover { border-color: var(--accent); }
.card h3 { font-size: 1.05rem; color: var(--accent); }
.card .old { font-size: .78rem; color: var(--muted); }
.card .b { font-size: .88rem; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--muted); }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .74rem; font-weight: 600; width: max-content; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.rep { background: var(--warn-soft); color: var(--warn); }
.pill.unc { background: var(--bad-soft); color: var(--bad); }
/* scheme detail */
.detail { max-width: 860px; width: 100%; margin: 0 auto; display: grid; gap: 14px; }
.detail h2 { font-size: 1.6rem; color: var(--accent); }
.detail .benefit { font-size: 1.05rem; background: var(--accent-soft); border-radius: var(--r); padding: 12px 16px; }
.detail section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; }
.detail section h3 { font-size: 1rem; margin-bottom: 6px; }
.detail ul, .detail ol { margin: 0; padding-left: 1.3rem; display: grid; gap: 4px; }
.linkbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.linkbtns a { text-decoration: none; }
.thinking .secs { font-variant-numeric: tabular-nums; }
.thinking small { display: block; font-size: .78rem; margin-top: 4px; }
#status table { width: 100%; border-collapse: collapse; font-size: .85rem; }
#status th, #status td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; vertical-align: top; }
#status td.err { color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
#status .tbl { overflow-x: auto; max-height: 60vh; }
.sch-note { font-size: .82rem; color: var(--muted); margin: 0; }
.big { padding: 10px 16px; font-size: .95rem; }
@media (max-width: 600px) { .brand span { display: none; } header.top { gap: 8px; } }
@media print { .app > header, .subnav { display: none !important; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1 data-t="brand">বিশ্বাস AI</h1><span data-t="brand_sub">Biswas AI for Office</span><small class="ver" title="App version">v6</small></div>
    <div class="seg" role="group" aria-label="Section">
      <button type="button" id="sec-office" aria-pressed="true" data-t="office">অফিস</button>
      <button type="button" id="sec-public" aria-pressed="false" data-t="public">জনসাধারণ</button>
    </div>
    <div class="langbox" role="group" aria-labelledby="lang-label">
      <span id="lang-label">ভাষা / Language</span>
      <div class="seg">
        <button type="button" id="lang-bn" aria-pressed="true" lang="bn">বাংলা</button>
        <button type="button" id="lang-en" aria-pressed="false" lang="en">English</button>
      </div>
    </div>
    <button class="btn" id="open-settings" type="button" data-t="settings">সেটিংস</button>
  </header>

function knowledge() {
  const parts = UPDATES.split(/\n(?=[A-F]\. )/);
  const said = messages.filter(m => m.role === "user").slice(-6).map(m => m.shown || m.content.slice(0, 2000)).join(" ") + " " + ($("#q") ? $("#q").value : "");
  const schemes = /প্রকল্প|যোজনা|ভাণ্ডার|ভান্ডার|ভাতা|পেনশন|কন্যারত্ন|কন্যাশ্রী|রূপশ্রী|অন্নপূর্ণা|আয়ুষ্মান|স্বাস্থ্যসাথী|কৃষকবন্ধু|কিষাণ|স্কলারশিপ|বৃত্তি|আবাস যোজনা|রেশন কার্ড|উজ্জ্বলা|বিশ্বকর্মা|কর্মসাথী|সারথি|\bscheme|prakalpa|yojana|bhandar|pension|allowance|kanya|annapurna|ayushman|krishak|kisan|scholarship|awas|ration card|ujjwala|vishwakarma/i.test(said);
  const staff = /\bDA\b|বেতন|মহার্ঘ|ছুটি|HRMS|\bleave\b|salary|\bpay\b|contractual|চুক্তিভিত্তিক|কর্মচারীর|employee|WFTS|e-?office/i.test(said);
  const keep = parts.filter(t => {
    const sec = t.trim().charAt(0);
    if (sec === "D") return false;            // replaced by the live catalogue below
    if (sec === "E") return mode === "office" || staff;
    return true;
  });
  if (mode === "public" || schemes) keep.push(catalogueText());
  return keep.join("\n");
}

  const pub = `MODE: PUBLIC. The user is a member of the public in West Bengal. Use plain, friendly, simple language and short steps: which office (BDO for rural / SDO or municipality for urban, etc.), which portal, which documents, any fee, and expected time. Use the CURRENT scheme names of the BJP-led government (section D), with the old name in brackets. Every application is decided by the competent authority (for SDO-office services, the SDO). Remind that government services are free at government camps and offices and that nobody should pay touts or look-alike websites. When they want an application written, write it with blanks for personal details.`;

/* ---------------- tiny markdown engine (shared by screen, Word, PDF, Excel) ---------------- */
function parseMd(src) {
  const L = String(src || "").replace(/\r/g, "").split("\n");
  const out = []; let para = [];
  const flush = () => { if (para.length) { out.push({ t: "p", text: para.join("\n") }); para = []; } };
  const isRow = s => /^\s*\|.*\|\s*$/.test(s);
  const isSep = s => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s);
  const cells = s => s.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  for (let i = 0; i < L.length; i++) {
    const line = L[i];
    if (/^\s*```/.test(line)) { flush(); const buf = []; i++; while (i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]); out.push({ t: "code", text: buf.join("\n") }); continue; }
    if (!line.trim()) { flush(); continue; }
    let m;
    if ((m = line.match(/^\s*(#{1,6})\s+(.*)$/))) { flush(); out.push({ t: "h", level: m[1].length, text: m[2].replace(/\s*#+\s*$/, "") }); continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push({ t: "hr" }); continue; }
    if (isRow(line) && i + 1 < L.length && isSep(L[i + 1])) {
      flush(); const rows = [cells(line)]; i += 2;
      while (i < L.length && isRow(L[i])) rows.push(cells(L[i++]));
      i--; out.push({ t: "table", rows }); continue;
    }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) {
      flush(); const items = [m[1]];
      while (i + 1 < L.length && (m = L[i + 1].match(/^\s*[-*•]\s+(.*)$/))) { items.push(m[1]); i++; }
      out.push({ t: "ul", items }); continue;
    }

/* inline: returns runs [{text, b, i, code}] */
function runs(s) {

    const tok = m[0];
    if (tok.startsWith("**") || tok.startsWith("__")) out.push({ text: tok.slice(2, -2), b: true });
    else if (tok.startsWith("`")) out.push({ text: tok.slice(1, -1), code: true });
    else out.push({ text: tok.slice(1, -1), i: true });
    last = m.index + tok.length;
  }
  if (last < s.length) out.push({ text: s.slice(last) });

}

}

    if (b.t === "p") return `<p>${inlineHtml(b.text)}</p>`;
    if (b.t === "hr") return "<hr>";
    if (b.t === "code") return `<pre><code>${esc(b.text)}</code></pre>`;
    if (b.t === "ul") return `<ul>${b.items.map(i => `<li>${inlineHtml(i)}</li>`).join("")}</ul>`;
    if (b.t === "ol") return `<ol start="${b.start}">${b.items.map(i => `<li>${inlineHtml(i)}</li>`).join("")}</ol>`;
    if (b.t === "table") {
      const [hd, ...rows] = b.rows;
      return `<div class="tbl"><table><thead><tr>${hd.map(c => `<th>${inlineHtml(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inlineHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }

}

const MAX_DOC_CHARS = 60000;
async function readFile(f) {
  const name = f.name; const ext = (name.split(".").pop() || "").toLowerCase();
  if (f.type.startsWith("image/")) {
    if (!imageLimits) throw new Error(t("no_image_view"));
    return { name, kind: "image", images: [f] };
  }
  if (ext === "pdf") {
    await load("pdfworker"); await load("pdfjs");
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
    let text = "";
    for (let p = 1; p <= pdf.numPages && text.length < MAX_DOC_CHARS; p++) {
      const c = await (await pdf.getPage(p)).getTextContent();
      text += `\n[Page ${p}]\n` + c.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("");
    }
    if (text.replace(/\[Page \d+\]|\s/g, "").length > 80) return { name, kind: "pdf", text: text.slice(0, MAX_DOC_CHARS), pages: pdf.numPages };
    // scanned PDF: send page pictures instead
    if (!imageLimits) throw new Error(t("scanned_pdf"));
    const imgs = [];
    for (let p = 1; p <= Math.min(pdf.numPages, imageLimits.maxCount || 4); p++) {
      const page = await pdf.getPage(p); const vp = page.getViewport({ scale: 1.6 });
      const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      imgs.push(await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85)));
    }
    return { name, kind: "scan", images: imgs, pages: pdf.numPages };
  }
  if (ext === "docx") {
    await load("mammoth");
    const r = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    return { name, kind: "docx", text: r.value.slice(0, MAX_DOC_CHARS) };
  }
  if (["xlsx", "xls", "csv"].includes(ext)) {
    await load("xlsx");
    const wb = window.XLSX.read(new Uint8Array(await f.arrayBuffer()), { type: "array" });
    const text = wb.SheetNames.map(n => `[Sheet: ${n}]\n` + window.XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n");

  if (["txt", "md"].includes(ext) || f.type.startsWith("text/")) return { name, kind: "text", text: (await f.text()).slice(0, MAX_DOC_CHARS) };

}

          else { // other formats: redraw as JPEG

            img = await out.embedJpg(await (await new Promise(r => cv.toBlob(r, "image/jpeg", 0.9))).arrayBuffer());
          }

          const sc = Math.min((595.28 - 2 * m) / img.width, (841.89 - 2 * m) / img.height, 1);
          page.drawImage(img, { x: (595.28 - img.width * sc) / 2, y: (841.89 - img.height * sc) / 2, width: img.width * sc, height: img.height * sc });
        }
      }
      const bytes = await out.save();
      await offer((id === "mrg" ? "merged" : baseName(files[0].name)) + ".pdf", new Blob([bytes], { type: "application/pdf" }));

// Memory lives in this browser (and can be exported / imported as a file). The model itself does not
// retrain; it gets better here by reading these remembered facts and the drafts the user approved.
let memory = store.get("bk:memory", []);        // [{text, at}]
let examples = store.get("bk:examples", []);    // [{type, title, md, at}]
const saveMemory = () => { store.set("bk:memory", memory); store.set("bk:examples", examples); };
const MEM_MAX = 80, EX_MAX = 10;
function learn(lines) {
  const added = [];
  for (let line of lines) {
    line = line.replace(/^\s*[-*•]\s*/, "").trim();
    if (!line) continue;
    const forget = line.match(/^FORGET:\s*(.+)$/i);
    if (forget) { const key = forget[1].toLowerCase(); memory = memory.filter(m => !m.text.toLowerCase().includes(key)); continue; }
    if (line.length > 300 || memory.some(m => m.text.toLowerCase() === line.toLowerCase())) continue;
    memory.push({ text: line, at: today() }); added.push(line);
  }
  if (memory.length > MEM_MAX) memory = memory.slice(-MEM_MAX);
  saveMemory();
  return added;
}
const DOC_START = /<<<DOC([^>\n]*)>>>/, DOC_END = "<<<END DOC>>>";
// Pulls the hidden memory block out of a reply (also while it is still streaming).
function splitMemory(text) {
  const i = text.indexOf("<<<MEMORY>>>");
  if (i < 0) return { clean: text.replace(/<<<?M?E?M?O?R?Y?>?>?>?\s*$/, ""), lines: [] };
  const j = text.indexOf("<<<END MEMORY>>>", i);
  const body = text.slice(i + 12, j < 0 ? undefined : j);
  return { clean: (text.slice(0, i) + (j < 0 ? "" : text.slice(j + 16))).trim(), lines: j < 0 ? [] : body.split("\n") };
}
// Splits a reply into chat text and document blocks.
function splitDocs(text) {
  const out = []; let rest = text;
  for (;;) {
    const m = rest.match(DOC_START);
    if (!m) { if (rest.trim()) out.push({ t: "text", md: rest.replace(/<<<D?O?C?[^>\n]*$/, "") }); break; }
    if (rest.slice(0, m.index).trim()) out.push({ t: "text", md: rest.slice(0, m.index) });
    const attr = m[1];
    const after = rest.slice(m.index + m[0].length);
    const end = after.indexOf(DOC_END);
    out.push({ t: "doc", type: (attr.match(/type="([^"]*)"/) || [])[1] || "other", title: (attr.match(/title="([^"]*)"/) || [])[1] || "document", md: (end < 0 ? after : after.slice(0, end)).trim(), open: end < 0 });
    if (end < 0) break;
    rest = after.slice(end + DOC_END.length);
  }
  return out;
}
function replaceDoc(text, j, md) {
  let n = -1;
  return text.replace(/(<<<DOC[^>\n]*>>>)([\s\S]*?)(<<<END DOC>>>)/g, (all, a, body, b) => (++n === j ? `${a}\n${md}\n${b}` : all));
}

  return `
These Bikram AI rules override any earlier output-format rule.
YOU ARE "BIKRAM AI" (বিক্রম AI), the office-work chat inside Biswas AI for Office, made by Bikram Biswas. Work like an experienced dealing assistant and drafting partner, in a natural chat.
How to work:
- If the user has not said what they need, greet in one line and ask what to create: notesheet, draft letter (DFA), office order, notice (hearing / show-cause), report, RTI reply, Excel table, Word file, PDF, or anything else.
- Then ask only for what is missing, at most two or three short questions at a time (subject, PUC / reference, addressee, key facts and dates, language). Use what you already remember instead of asking again. If the user says "you decide" or has given enough, write it.
- When you produce a document, put it between a line <<<DOC type="notesheet|letter|order|notice|report|table|other" title="short English title">>> and a line <<<END DOC>>>. Inside: only the document in Markdown, ready to print, written in paragraphs (not points), except naturally list-like parts such as enclosures or copy-to lines. For Excel or any tabular need, use type="table" and a Markdown table.
- Outside the block write at most two short lines (what to fill in or check) and offer to change anything. For a change request, output the complete revised document in a new block.
- Word, PDF, Excel and Print buttons appear under every document automatically; do not explain how to convert files.
Memory (it makes you better over time):
- What you remember about this user and office is listed below. Use it (names, designations, office, preferred language and format) without asking again.
- When you learn a lasting fact or preference (names and designations, office details, preferred language or layout, a correction the user makes, recurring tasks), add at the very end of your reply a block: a line <<<MEMORY>>>, then one fact per line starting with "- ", then a line <<<END MEMORY>>>. Only durable, useful facts. To drop a wrong memory write "- FORGET: <words of that memory>". Skip the block when there is nothing new.
WHAT YOU REMEMBER:
${mem}
${examples.length ? "DRAFTS THIS OFFICE APPROVED (follow their style and layout):" : "MODEL DOCUMENTS (follow this standard of language, structure and layout; English documents use the same structure):"}
${ex}`;
}

const tasks = () => TASKS[mode][settings.lang] || TASKS[mode].bn;
function welcomeHtml() {
  const office = mode === "office";
  if (office) return bikramWelcome();
  return `<div class="welcome">
    <h2>${esc(t(office ? "w_office_h" : "w_public_h"))}</h2>
    <p>${esc(t(office ? "w_office_p" : "w_public_p"))}</p>
    ${office ? "" : `<div><button class="btn primary big" type="button" data-go-catalog>${esc(t("see_schemes"))}</button></div>`}
    <div class="starters">${tasks().map((x, k) => `<button class="starter" type="button" data-task="${k}"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></button>`).join("")}</div>
  </div>`;
}
function thinkingHtml(m) {
  const s = Math.max(0, Math.round((Date.now() - (m.started || Date.now())) / 1000));
  return `<span class="thinking">${esc(t("thinking"))} <span class="secs" data-started="${m.started || Date.now()}">${s}</span> ${esc(t("secs"))}<small${s < 20 ? " hidden" : ""}>${esc(t("slow"))}</small></span>`;
}
function msgHtml(m, k) {
  if (m.role !== "user" && mode === "office") return bikramMsgHtml(m, k);
  if (m.role === "user") {
    return `<div class="msg user">${m.files && m.files.length ? `<div class="files">${m.files.map(f => `<span class="file">${esc(f)}</span>`).join("")}</div>` : ""}<div class="bubble">${esc(m.shown ?? m.content)}</div></div>`;
  }
  const hasTable = parseMd(m.content).some(b => b.t === "table");
  return `<div class="msg ai" data-k="${k}">
    ${m.editing ? `<textarea class="edit-area" id="edit-${k}" aria-label="${esc(t("edit"))}">${esc(m.content)}</textarea>` : `<div class="doc">${m.content ? mdToHtml(m.content) : (m.done ? "" : thinkingHtml(m))}</div>`}
    ${m.error ? `<div class="err">${esc(m.error)}</div>` : ""}
    ${m.via && m.done ? `<div class="via">${esc(t("answered_by"))}${esc(PROVIDER_NAMES[m.via] || m.via)}</div>` : ""}
    ${m.done && m.content ? `<div class="actions">
      ${m.editing ? `<button class="btn small primary" data-act="edit-save">${esc(t("save"))}</button>` : `<button class="btn small" data-act="copy">${esc(t("copy"))}</button><button class="btn small" data-act="edit">${esc(t("edit"))}</button>`}
      ${canSave() && !m.editing ? `<button class="btn small" data-act="docx">Word</button><button class="btn small" data-act="pdf">PDF</button>${hasTable ? `<button class="btn small" data-act="xlsx">Excel</button>` : ""}` : ""}
      ${mode === "office" && !m.editing ? `<button class="btn small" data-act="todraft">${esc(t("tab_draft"))} →</button>` : ""}
    </div>` : ""}
  </div>`;
}
function renderChat() {
  $("#thread").innerHTML = messages.length ? messages.map(msgHtml).join("") : welcomeHtml();
  $("#q").placeholder = t(mode === "office" ? "ph_bikram" : "ph_public");
  $("#open-memory").hidden = mode !== "office";
  renderPending();
}
const render = renderChat;
function renderPending() {
  $("#pending").innerHTML = pendingFiles.map((f, k) => `<span class="file">${esc(f.name)}${f.kind === "scan" ? esc(t("scan")) : ""}<button type="button" data-unpend="${k}" aria-label="${esc(t("remove"))}">✕</button></span>`).join("");
}
function updateAt(k) { const el = document.querySelector(`.msg.ai[data-k="${k}"]`); if (el) el.outerHTML = msgHtml(messages[k], k); else renderChat(); }
const updateLast = () => updateAt(messages.length - 1);
const scrollDown = () => { const s = $("#scroll"); s.scrollTop = messages.length ? s.scrollHeight : 0; };
const persist = () => {
  for (const sec of ["office", "public"]) {
    const keep = chats[sec].filter(m => m.done || m.role === "user").map(m => ({ role: m.role, content: m.content, shown: m.shown, files: m.files, done: m.done, error: m.error, via: m.via }));
    store.set("chat:" + sec, keep.slice(-40));
  }
};
function setBusy(b) {
  $("#send").innerHTML = b ? `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>` : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
}
setInterval(() => {
  document.querySelectorAll(".thinking .secs").forEach(el => {
    const s = Math.round((Date.now() - Number(el.dataset.started)) / 1000);
    el.textContent = s;
    const hint = el.parentElement.querySelector("small");
    if (hint) hint.hidden = s < 20;
  });
}, 1000);
async function ask(text) {
  if (!engine) return toast(t("no_ai"));
  if (ctl) return toast(errText("busy"));
  if (tabs[mode] !== "chat") go(mode, "chat");
  const files = pendingFiles; pendingFiles = [];
  let content = text;
  const docs = attachText(files);
  if (docs) content += "\n\n" + docs;
  const imgs = attachImages(files);
  if (imgs.length) content += `\n\n(${imgs.length} image(s) attached: ${files.filter(f => f.images).map(f => f.name + (f.kind === "scan" ? " — scanned PDF pages" : "")).join(", ")}. Read them carefully, including Bengali text.)`;
  const box = messages;
  const wantDoc = box === chats.office ? bkPending : null;
  if (wantDoc) { content += `\n\n[Bikram AI task: using the details above, earlier messages and any attached file, write the ${BK_DESC[wantDoc] || "document"} now, complete and ready to print. Put it in one <<<DOC type="${wantDoc}" title="short English title">>> ... <<<END DOC>>> block. Paragraphs, not points. Leave ______ for anything not given. Do not ask more questions now.]`; setPending(null); }
  box.push({ role: "user", content, shown: text, files: files.map(f => f.name), done: true });
  const ai = { role: "assistant", content: "", done: false, started: Date.now(), wantDoc };
  box.push(ai);
  renderChat(); scrollDown(); setBusy(true);
  let turns = box.slice(0, -1).filter(m => m.content && (m.role === "user" || m.done)).map(m => ({ role: m.role, content: m.content }));
  while (turns.length > 1 && JSON.stringify(turns).length > 180000) turns.shift();
  while (turns.length && turns[0].role !== "user") turns.shift();
  ctl = new AbortController();
  const live = () => box === messages;
  const agent = box === chats.office;
  try {
    const r = await aiRun(turns, { images: imgs, signal: ctl.signal, agent, onText: ({ text }) => { ai.content = text; if (live()) updateAt(box.indexOf(ai)); } });
    ai.content = r.text; ai.via = r.via;
    if (agent) {
      const sm = splitMemory(r.text); ai.content = sm.clean || r.text; ai.learned = learn(sm.lines);
      // the AI forgot the document markers: treat the whole answer as the document
      if (wantDoc && !DOC_START.test(ai.content)) ai.content = `<<<DOC type="${wantDoc}" title="${wantDoc}">>>\n${ai.content.replace(/^```[a-z]*\n?|```\s*$/g, "").trim()}\n<<<END DOC>>>`;
    }
    if (r.truncated) ai.error = errText("cut");
  } catch (e) {
    const code = e && e.code;
    ai.content = code === "refused" ? "" : ((e && e.text) || ai.content);
    if (code === "cancelled") { if (!ai.content) ai.content = t("stopped"); }
    else ai.error = aiFailed(e);
  } finally {
    ai.done = true; ctl = null; setBusy(false); if (live()) updateAt(box.indexOf(ai)); persist();
  }
}

async function openStatus() {
  const body = $("#status-body");
  $("#status").showModal();
  if (engine === "claude") { body.innerHTML = `<p>${esc(t("stat_claude"))}</p>`; return; }
  body.innerHTML = `<p>${esc(t("stat_checking"))}</p>`;
  try {
    const r = await (await fetch("api/chat?test=1", { cache: "no-store" })).json();
    if (!r.results || !r.results.length) { body.innerHTML = `<p>${esc(t("stat_none"))}</p>`; return; }
    body.innerHTML = `<div class="tbl"><table><thead><tr><th>${esc(t("th_ai"))}</th><th>${esc(t("th_model"))}</th><th>${esc(t("th_res"))}</th><th>${esc(t("th_time"))}</th><th>${esc(t("th_why"))}</th></tr></thead><tbody>${
      r.results.map(x => `<tr><td>${esc(PROVIDER_NAMES[x.provider] || x.provider)}</td><td>${esc(x.model)}</td><td><span class="pill ${x.ok ? "ok" : "unc"}">${esc(t(x.ok ? "stat_ok" : "stat_fail"))}</span></td><td>${(x.ms / 1000).toFixed(1)}s</td><td class="err">${esc(x.ok ? "" : `${x.status || ""} ${x.error || ""}`.trim())}</td></tr>`).join("")
    }</tbody></table></div><p class="sch-note">${esc(t("stat_help"))}</p>`;
  } catch (e) { body.innerHTML = `<p>${esc(t("stat_err"))}</p>`; }
}

// table maker
$("#t-grid").addEventListener("input", e => { const td = e.target.closest("td[data-r]"); if (!td) return; grid[+td.dataset.r][+td.dataset.c] = td.innerText.replace(/\n+$/, ""); saveGrid(); });
$("#t-aiform").addEventListener("submit", async e => {
  e.preventDefault();
  const src = $("#t-src").value.trim(); if (!src) return $("#t-src").focus();
  if (tableBusy) return toast(errText("busy"));
  tableBusy = true; $("#t-status").textContent = t("d_writing");
  try {
    const r = await aiRun([{ role: "user", content: `Turn the following information into one clean table for an office report. Reply with only a Markdown table (header row first, then a separator row), no other text. Keep numbers as plain numbers. Language of headings: ${settings.lang === "en" ? "English" : "Bengali"}.\n\n${src}` }]);
    const tb = parseMd(r.text).find(b => b.t === "table");
    if (!tb) throw { code: "no_table" };
    grid = tb.rows.map(row => row.map(c => plain(c))); saveGrid(); renderGrid();
    $("#t-status").textContent = `${t("t_loaded")} · ${t("answered_by")}${PROVIDER_NAMES[r.via] || r.via || ""}`;
  } catch (err) { $("#t-status").textContent = err && err.code === "no_table" ? t("t_bad") : aiFailed(err); }
  finally { tableBusy = false; }
});
$("#t-file").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    await load("xlsx");

  } catch (err) { toast(t("dl_fail")); }
});

$("#c-search").addEventListener("input", renderCatalog);
$("#mem-addform").addEventListener("submit", e => { e.preventDefault(); const v = $("#mem-new").value.trim(); if (!v) return; learn([v]); $("#mem-new").value = ""; renderMemory(); });
$("#mem-file").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    learn((j.memory || []).map(m => m.text || m));
    for (const ex of j.examples || []) if (ex && ex.md && !examples.some(x => x.md === ex.md)) examples.push(ex);
    examples = examples.slice(-EX_MAX); saveMemory(); renderMemory(); toast(t("mem_imported"));
  } catch (err) { toast(t("dl_fail")); }
});

document.addEventListener("click", e => {
  const el = sel => e.target.closest(sel);
  let x;
  if ((x = el("[data-tab]"))) return go(mode, x.dataset.tab);
  if (el("#sec-office")) return go("office");
  if (el("#sec-public")) return go("public");
  if (el("#lang-bn, #lang-en")) return setLang(el("#lang-en") ? "en" : "bn");
  if ((x = el("[data-pick-lang]"))) { $("#langpick").close(); return setLang(x.dataset.pickLang); }
  // catalogue
  if ((x = el("[data-cat]"))) { catFilter = x.dataset.cat; return renderCatalog(); }
  if ((x = el("[data-open]"))) return openDetail(x.dataset.open);
  if (el("[data-back], [data-go-catalog]")) { try { history.replaceState(null, "", location.pathname + location.search); } catch (err) { /* ignore */ } return go("public", "catalog"); }
  if ((x = el("[data-ask-about]"))) { const s = SERVICES.find(v => v.id === x.dataset.askAbout); return ask(t("ask_scheme", s[settings.lang].n)); }
  if ((x = el("[data-ask-app]"))) { const s = SERVICES.find(v => v.id === x.dataset.askApp); return ask(t("ask_app", s[settings.lang].n)); }
  // drafting desk
  if (el("#d-toggle")) { draftPreview = !draftPreview; return renderDraftForm(); }
  if (el("#d-docx") || el("#d-pdf")) { if (!draft.text.trim()) return toast(t("d_empty")); return save(el("#d-docx") ? "docx" : "pdf", draft.text, e.target.closest("button"), draft.type); }
  if (el("#d-copy")) return navigator.clipboard.writeText(draft.text).then(() => toast(t("copied")), () => toast(t("copy_fail")));
  if (el("#d-undo")) { if (draft.prev) { const cur = draft.text; draft.text = draft.prev; draft.prev = cur; saveDraft(); renderDraftForm(); } return; }
  if (el("#d-clear")) { if (draft.text) draft.prev = draft.text; draft.text = ""; ["to", "sub", "ref", "facts"].forEach(k => { draft[k] = ""; }); draftFiles = []; saveDraft(); renderDraftForm(); return toast(t("d_cleared")); }
  if ((x = el("[data-dunpend]"))) { draftFiles.splice(+x.dataset.dunpend, 1); return renderDraftForm(); }
  if (el("#d-fmt-btn")) return $("#open-settings").click();
  // table maker
  if (el("#t-addrow")) { grid.push(grid[0].map(() => "")); saveGrid(); return renderGrid(); }
  if (el("#t-addcol")) { grid.forEach(r => r.push("")); saveGrid(); return renderGrid(); }
  if (el("#t-delrow")) { if (grid.length > 1) grid.pop(); saveGrid(); return renderGrid(); }
  if (el("#t-delcol")) { if (grid[0].length > 1) grid.forEach(r => r.pop()); saveGrid(); return renderGrid(); }
  if (el("#t-clear")) { grid = [grid[0].map(() => ""), grid[0].map(() => "")]; saveGrid(); return renderGrid(); }
  if (el("#t-open")) return $("#t-file").click();
  if (el("#t-copy")) return navigator.clipboard.writeText(grid.map(r => r.join("\t")).join("\n")).then(() => toast(t("copied")), () => toast(t("copy_fail")));
  if ((x = el("#t-xlsx"))) { const b = x; b.disabled = true; return load("xlsx").then(() => offer(`table-${stamp()}.xlsx`, gridToXlsx())).catch(err => toast(err.message || t("dl_fail"))).finally(() => { b.disabled = false; }); }
  if ((x = el("#t-pdf"))) { const b = x; b.disabled = true; return htmlToPdf(gridHtml(), grid[0].length > 5).then(d => offer(`table-${stamp()}.pdf`, d)).catch(err => toast(err.message || t("dl_fail"))).finally(() => { b.disabled = false; }); }
  // file tools
  if ((x = el("[data-pick]"))) return $("#tf-" + x.dataset.pick).click();
  if ((x = el("[data-run]"))) return runTool(x.dataset.run, x);
  if (el("#tp-copy")) return navigator.clipboard.writeText($("#tp-out").value).then(() => toast(t("copied")), () => toast(t("copy_fail")));
  if (el("#tp-draft")) { draft.facts = $("#tp-out").value.slice(0, 20000); saveDraft(); go("office", "draft"); return toast(t("f_sent")); }
  if ((x = el("#tp-docx"))) return save("docx", $("#tp-out").value, x, "text");
  // chat
  if ((x = el("[data-task]"))) { q.value = tasks()[+x.dataset.task][2]; autosize(); q.focus(); q.setSelectionRange(q.value.length, q.value.length); return; }
  if ((x = el("[data-unpend]"))) { pendingFiles.splice(+x.dataset.unpend, 1); return renderPending(); }
  // Bikram AI
  if ((x = el("[data-bk]"))) {
    const i = +x.dataset.bk, flow = BK_FLOW[i];
    if (!flow) return ask(t("bk_choices")[i][2]);
    messages.push({ role: "user", content: t("bk_choices")[i][2], shown: t("bk_choices")[i][2], done: true });
    messages.push({ role: "assistant", content: flow[settings.lang === "en" ? 2 : 1], done: true, via: "bikram" });
    setPending(flow[0]); persist(); renderChat(); scrollDown(); q.focus(); return;
  }
  if ((x = el("[data-dact]"))) {
    const k = +x.dataset.k, j = +x.dataset.j, m = messages[k], act = x.dataset.dact;
    const d = splitDocs(splitMemory(m.content).clean).filter(p => p.t === "doc")[j];
    if (act === "edit-save") { m.content = replaceDoc(m.content, j, $(`#edoc-${k}`).value); m.editDoc = null; updateAt(k); persist(); return toast(t("doc_saved")); }
    if (!d) return;
    if (act === "print") return printDoc(d.md);
    if (act === "edit") { m.editDoc = j; updateAt(k); return; }
    if (act === "desk") { draft.prev = draft.text; draft.text = d.md; saveDraft(); return go("office", "draft"); }
    if (act === "approve") { examples.push({ type: d.type, title: d.title, md: d.md.slice(0, 4000), at: today() }); if (examples.length > EX_MAX) examples = examples.slice(-EX_MAX); saveMemory(); return toast(t("doc_approved")); }
    const name = (d.title.replace(/[^A-Za-z0-9 _-]/g, "").trim().replace(/\s+/g, "-").slice(0, 40) || d.type);
    return save(act, d.md, x, name);
  }
  if (el("[data-open-memory], #open-memory")) return openMemory();
  if (el("#memory-close")) return $("#memory").close();
  if ((x = el("[data-mem-del]"))) { memory.splice(+x.dataset.memDel, 1); saveMemory(); return renderMemory(); }
  if ((x = el("[data-ex-del]"))) { examples.splice(+x.dataset.exDel, 1); saveMemory(); return renderMemory(); }
  if (el("#mem-export")) return offer(`bikram-ai-memory-${stamp()}.json`, new Blob([JSON.stringify({ app: "Biswas AI for Office", memory, examples }, null, 2)], { type: "application/json" }));
  if (el("#mem-import")) return $("#mem-file").click();
  if (el("#mem-clear")) { memory = []; examples = []; saveMemory(); renderMemory(); return toast(t("mem_cleared")); }
  if ((x = el("[data-act]"))) {
    const k = +x.closest(".msg").dataset.k; const m = messages[k]; const act = x.dataset.act;
    if (act === "copy") navigator.clipboard.writeText(m.content).then(() => toast(t("copied")), () => toast(t("copy_fail")));
    else if (act === "print") printDoc(m.content);
    else if (act === "edit") { m.editing = true; updateAt(k); const ta = $(`#edit-${k}`); if (ta) ta.focus(); }
    else if (act === "edit-save") { m.content = $(`#edit-${k}`).value; m.editing = false; updateAt(k); persist(); toast(t("saved_edit")); }
    else if (act === "todraft") { draft.prev = draft.text; draft.text = m.content; saveDraft(); go("office", "draft"); }
    else save(act, m.content, x);
    return;
  }
  if (el("#new-chat")) { if (ctl) ctl.abort(); messages.length = 0; pendingFiles = []; persist(); return renderChat(); }
  if (el("#open-status")) return openStatus();
  if (el("#status-close")) return $("#status").close();
  if (el("#open-settings")) {
    const f = $("#settings-form"); Object.keys(DEFAULTS).forEach(k => { f.elements[k].value = settings[k]; }); showSample(); $("#settings").showModal();
  }
  if (el("#sample-clear")) { delete settings.sampleName; delete settings.sampleText; store.set("settings", settings); showSample(); renderDraftForm(); toast(t("sample_removed")); }
});
function showSample() {
  $("#sample-status").textContent = settings.sampleText ? t("format_on") + settings.sampleName : t("none_sample");
  $("#sample-clear").hidden = !settings.sampleText;
}
$("#sample-in").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const r = await readFile(f);
    if (!r.text || !r.text.trim()) throw new Error(t("sample_bad"));
    settings.sampleName = f.name; settings.sampleText = r.text.replace(/\[Page \d+\]\n?/g, "").trim().slice(0, 6000);
    store.set("settings", settings); showSample(); renderDraftForm(); toast(t("sample_saved"));
  } catch (err) { toast(err.message || t("sample_bad")); }
});
$("#settings").addEventListener("close", () => {
  if ($("#settings").returnValue !== "save") return;
  const f = $("#settings-form"); Object.keys(DEFAULTS).forEach(k => { settings[k] = f.elements[k].value.trim() || DEFAULTS[k]; });
  store.set("settings", settings); toast(t("settings_saved"));
});

/* ---------------- start ---------------- */
Object.values(chats).forEach(list => list.forEach(m => { m.done = true; m.editing = false; }));
if (OWNER_NOTICE) { const n = $("#owner-notice"); n.textContent = OWNER_NOTICE; n.hidden = false; }
applyLang();
{ const id = (location.hash.match(/^#s-([\w-]+)/) || [])[1]; if (id && SERVICES.some(s => s.id === id)) { mode = "public"; messages = chats.public; openDetail(id); } else showView(); }
if (!store.get("langChosen", false)) { try { $("#langpick").showModal(); } catch (e) { /* dialog unsupported */ } }
(async () => {
  if (!window.claude || !window.claude.use) {
    engine = "server"; imageLimits = { maxCount: 4 };
    $("#engine-note").textContent = " · Gemini, Llama, Kimi, Mistral +";
    try { const h = await (await fetch("api/chat", { cache: "no-store" })).json(); if (!h.configured) showBanner(() => errText("server_unconfigured")); }
    catch (e) { showBanner(() => t("unreachable")); }
    if (tabs[mode] === "chat") renderChat();
    return;
  }
  const [s, d] = await Promise.all([window.claude.use("sample").catch(() => null), window.claude.use("downloads").catch(() => null)]);
  sample = s; downloads = d;
  if (sample) { engine = "claude"; try { const lim = await sample.limits(); imageLimits = lim.images || null; } catch (e) { imageLimits = null; } }
  else showBanner(() => t("no_ai_claude"));
  if (tabs[mode] === "chat") renderChat();
})();
</script>
</body>
</html>
