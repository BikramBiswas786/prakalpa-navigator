<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biswas AI for Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Noto+Sans:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Serif:wght@400;700&family=Noto+Serif+Bengali:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen chat tool. Header with mode switch; desktop gets a left rail of
   ready tasks; the conversation column holds answers set like office paper. */
:root {
  --paper: #f3f4f8;
  --surface: #ffffff;
  --sheet: #fffefb;
  --ink: #1c2233;
  --muted: #5a6276;
  --line: #d8dbe5;
  --accent: #3f3297;       /* stamp-pad violet */
  --accent-ink: #ffffff;
  --accent-soft: #ebe9f8;
  --user: #e7e5f7;
  --ok: #1d7448; --ok-soft: #e3f3ea;
  --warn: #965400; --warn-soft: #fbefdc;
  --bad: #ad261d; --bad-soft: #fbe5e3;
  --f-display: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
  --f-body: "Noto Sans", "Noto Sans Bengali", system-ui, sans-serif;
  --f-doc: "Noto Serif", "Noto Serif Bengali", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12141b; --surface: #1a1d27; --sheet: #1f2230; --ink: #e5e7ef; --muted: #9ba2b5; --line: #2d3242;
    --accent: #a99df2; --accent-ink: #15122b; --accent-soft: #29254a; --user: #2a2650;
    --ok: #6fcf9b; --ok-soft: #173126; --warn: #e6ac57; --warn-soft: #362812; --bad: #f2948b; --bad-soft: #3a1c1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12141b; --surface: #1a1d27; --sheet: #1f2230; --ink: #e5e7ef; --muted: #9ba2b5; --line: #2d3242;
  --accent: #a99df2; --accent-ink: #15122b; --accent-soft: #29254a; --user: #2a2650;
  --ok: #6fcf9b; --ok-soft: #173126; --warn: #e6ac57; --warn-soft: #362812; --bad: #f2948b; --bad-soft: #3a1c1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.25; margin: 0; text-wrap: balance; }
a { color: var(--accent); }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; min-width: 0; }
.brand h1 { font-size: 1.35rem; color: var(--accent); }
.brand span { font-family: var(--f-display); font-weight: 600; color: var(--muted); font-size: .92rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-weight: 600; font-family: var(--f-display); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: .88rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 3px 9px; font-size: .8rem; font-weight: 600; }
.btn[disabled] { opacity: .5; cursor: default; }

.body { min-height: 0; display: grid; grid-template-columns: 270px minmax(0, 1fr); }
@media (max-width: 900px) { .body { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } }
.rail { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 16px; display: grid; align-content: start; gap: 18px; }
.rail h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin-bottom: 6px; }
.tasks { display: grid; gap: 4px; }
.task { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; cursor: pointer; display: grid; gap: 0; }
.task:hover { background: var(--accent-soft); }
.task b { font-family: var(--f-display); font-weight: 600; font-size: .98rem; }
.task small { color: var(--muted); font-size: .78rem; line-height: 1.35; }
.railnote { font-size: .8rem; color: var(--muted); line-height: 1.45; }
.railnote ul { margin: 4px 0 0; padding-left: 1rem; display: grid; gap: 3px; }
@media (max-width: 900px) { .rail { display: none; } }
.sample-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: .82rem; font-family: var(--f-display); }
.chip:hover { border-color: var(--accent); color: var(--accent); }

.chat { min-height: 0; display: grid; grid-template-rows: auto 1fr auto; }
.banner { margin: 10px auto 0; width: min(820px, 100%); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.banner div { font-size: .85rem; background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; }
.banner { grid-row: 1; }
.scroll { grid-row: 2; overflow-y: auto; min-height: 0; }
.composer { grid-row: 3; }
.thread { width: min(820px, 100%); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 24px; display: grid; gap: 18px; }
.msg { display: grid; gap: 6px; min-width: 0; }
.msg.user { justify-items: end; }
.msg.user .bubble { background: var(--user); border-radius: 14px 14px 4px 14px; padding: 9px 14px; max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere; }
.files { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.file { font-size: .78rem; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 8px; }
.msg.ai .doc { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; min-width: 0; overflow-wrap: anywhere; }
.doc > :first-child { margin-top: 0; } .doc > :last-child { margin-bottom: 0; }
.doc p { margin: 0 0 10px; }
.doc h1, .doc h2, .doc h3, .doc h4 { margin: 14px 0 8px; font-size: 1.08rem; }
.doc h1 { font-size: 1.2rem; }
.doc ul, .doc ol { margin: 0 0 10px; padding-left: 1.5rem; }
.doc li { margin: 2px 0; }
.doc hr { border: 0; border-top: 1px dashed var(--line); margin: 14px 0; }
.doc code { font-family: var(--f-mono); font-size: .85em; background: var(--paper); padding: 0 4px; border-radius: 4px; }
.doc pre { background: var(--paper); padding: 10px; border-radius: 6px; overflow-x: auto; }
.doc .tbl { overflow-x: auto; margin: 0 0 10px; }
.doc table { border-collapse: collapse; font-size: .9rem; min-width: 60%; }
.doc th, .doc td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.doc th { background: var(--accent-soft); }
.thinking { color: var(--muted); font-style: italic; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.err { font-size: .85rem; color: var(--bad); }
.via { font-size: .72rem; color: var(--muted); }
.edit-area { width: 100%; min-height: 240px; border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--sheet); font: 14px/1.55 var(--f-mono); }

.welcome { display: grid; gap: 14px; padding-top: 12px; }
.welcome h2 { font-size: 1.6rem; }
.welcome p { color: var(--muted); margin: 0; max-width: 62ch; }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.starter { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; cursor: pointer; display: grid; gap: 2px; }
.starter:hover { border-color: var(--accent); }
.starter b { font-family: var(--f-display); font-weight: 600; color: var(--accent); }
.starter span { font-size: .85rem; color: var(--muted); }
.mobile-tasks { display: none; }
@media (max-width: 900px) { .mobile-tasks { display: block; } }

.composer { background: var(--surface); border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer .inner { width: min(820px, 100%); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
.pending { display: flex; gap: 6px; flex-wrap: wrap; }
.pending .file { display: inline-flex; gap: 6px; align-items: center; }
.pending .file button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0; }
.box { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: 12px; padding: 6px; background: var(--paper); }
.box textarea { flex: 1; min-width: 0; border: 0; background: none; resize: none; max-height: 200px; min-height: 40px; padding: 8px; outline: none; }
.iconbtn { border: 0; background: none; cursor: pointer; width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn:hover { background: var(--accent-soft); color: var(--accent); }
.send { background: var(--accent); color: var(--accent-ink); }
.send:hover { background: var(--accent); color: var(--accent-ink); opacity: .9; }
.hint { font-size: .74rem; color: var(--muted); text-align: center; }

dialog { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); width: min(500px, calc(100vw - 32px)); padding: 20px; }
dialog::backdrop { background: rgba(10, 10, 30, .45); }
.form { display: grid; gap: 10px; }
.field { display: grid; gap: 3px; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field input, .field select { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 7px 9px; width: 100%; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: .88rem; z-index: 20; max-width: calc(100vw - 32px); }

/* A4 sheet handed to the PDF renderer */
.pdf-doc { width: 180mm; background: #fff; color: #000; font: 12pt/1.6 "Noto Serif", "Noto Serif Bengali", serif; padding: 0; }
.pdf-doc table { border-collapse: collapse; width: 100%; font-size: 10.5pt; }
.pdf-doc th, .pdf-doc td { border: 1px solid #555; padding: 4px 6px; text-align: left; vertical-align: top; }
.pdf-doc p { margin: 0 0 8pt; } .pdf-doc ul, .pdf-doc ol { margin: 0 0 8pt; padding-left: 18pt; }
.pdf-doc h1, .pdf-doc h2, .pdf-doc h3 { font-size: 13pt; margin: 8pt 0 6pt; }
.pdf-doc hr { border: 0; border-top: 1px solid #999; }
.pdf-doc .tbl { overflow: visible; }
/* menu drawer, language switch, schemes, status */
.menu-btn { display: none; }
@media (max-width: 900px) {
  .menu-btn { display: inline-flex; }
  .brand span { display: none; }
  header.top { gap: 8px; }
  body.rail-open .rail { display: grid; position: fixed; top: 0; bottom: 0; left: 0; width: min(320px, 86vw); z-index: 30; box-shadow: 0 0 40px rgba(0,0,0,.3); padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  body.rail-open .scrim { display: block; }
}
.scrim { display: none; position: fixed; inset: 0; background: rgba(10, 10, 30, .4); z-index: 25; }
.rail-close { display: none; }
@media (max-width: 900px) { .rail-close { display: inline-flex; justify-self: end; } }
.big { padding: 10px 16px; font-size: .95rem; }
#schemes { width: min(960px, calc(100vw - 24px)); max-height: 92vh; padding: 0; }
#schemes .sch-head { position: sticky; top: 0; background: var(--surface); padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; z-index: 1; }
#schemes .sch-head .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
#schemes .sch-head input { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 10px; width: 100%; }
.sch-note { font-size: .82rem; color: var(--muted); margin: 0; }
.sch-list { padding: 16px 20px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.sch { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; background: var(--sheet); min-width: 0; }
.sch h3 { font-size: 1.08rem; color: var(--accent); }
.sch .old { font-size: .8rem; color: var(--muted); }
.sch dl { margin: 0; display: grid; gap: 6px; }
.sch dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.sch dd { margin: 0; font-size: .9rem; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: .74rem; font-weight: 600; width: max-content; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.rep { background: var(--warn-soft); color: var(--warn); }
.pill.unc { background: var(--bad-soft); color: var(--bad); }
.thinking .secs { font-variant-numeric: tabular-nums; }
.thinking small { display: block; font-size: .78rem; margin-top: 4px; }
#status table { width: 100%; border-collapse: collapse; font-size: .85rem; }
#status th, #status td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; vertical-align: top; }
#status td.err { color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
#status .tbl { overflow-x: auto; max-height: 60vh; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="btn menu-btn" id="menu" type="button" data-t="menu">মেনু</button>
    <div class="brand"><h1>বিশ্বাস AI</h1><span>Biswas AI for Office</span></div>
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" id="mode-office" aria-pressed="true" data-t="office">অফিস</button>
      <button type="button" id="mode-public" aria-pressed="false" data-t="public">জনসাধারণ</button>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" id="lang-bn" aria-pressed="true">বাংলা</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
    <button class="btn" id="open-schemes" type="button" data-t="schemes">প্রকল্প</button>
    <button class="btn" id="new-chat" type="button" data-t="newchat">নতুন চ্যাট</button>
    <button class="btn" id="open-settings" type="button" data-t="settings">সেটিংস</button>
  </header>

  <div class="body">
    <div class="scrim" id="scrim"></div>
    <aside class="rail" aria-label="Menu">
      <button class="btn small rail-close" id="rail-close" type="button" data-t="close">বন্ধ</button>
      <section><h2 id="rail-title"></h2><div class="tasks" id="rail-tasks"></div></section>
      <section><h2 data-t="rail_schemes">প্রকল্প</h2><div class="chips" id="scheme-chips"></div>
        <div style="margin-top:8px"><button class="btn small" type="button" id="open-schemes2" data-t="all_schemes">সব প্রকল্পের বিস্তারিত</button></div></section>
      <section class="railnote" id="rail-format">
        <h2 data-t="rail_format">অফিসের ফরম্যাট</h2>
        <span id="rail-sample"></span>
        <div style="margin-top:6px"><button class="btn small" type="button" id="open-settings2" data-t="give_sample">নমুনা চিঠি দিন</button></div>
      </section>
      <section class="railnote">
        <h2 data-t="rail_files">ফাইল দিন</h2>
        <span data-t="files_help"></span>
      </section>
      <section class="railnote">
        <button class="btn small" type="button" id="open-status" data-t="status">AI অবস্থা</button>
      </section>
      <section class="railnote" id="owner-notice" hidden></section>
    </aside>

    <section class="chat">
      <div class="banner" id="banner" hidden><div id="banner-text"></div></div>
      <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
      <div class="composer">
        <div class="inner">
          <div class="pending" id="pending"></div>
          <form class="box" id="ask">
            <input type="file" id="file-in" multiple hidden accept=".pdf,.docx,.xlsx,.xls,.csv,.txt,.md,image/*">
            <button class="iconbtn" type="button" id="attach" aria-label="Attach">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.1l-9.2 9.2a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 015.7 5.7l-9.2 9.2a2 2 0 01-2.8-2.8l8.5-8.5"/></svg>
            </button>
            <textarea id="q" rows="1"></textarea>
            <button class="iconbtn send" type="submit" id="send" aria-label="Send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </form>
          <div class="hint"><span data-t="hint"></span><span id="engine-note"></span></div>
        </div>
      </div>
    </section>
  </div>
</div>

<dialog id="settings">
  <form method="dialog" class="form" id="settings-form">
    <h2 data-t="set_title">সেটিংস</h2>
    <p style="margin:0;color:var(--muted);font-size:.88rem" data-t="set_sub"></p>
    <div class="field"><label for="s-officer" data-t="officer"></label><input id="s-officer" name="officer"></div>
    <div class="field"><label for="s-subdiv" data-t="subdiv"></label><input id="s-subdiv" name="subdiv"></div>
    <div class="field"><label for="s-district" data-t="district"></label><input id="s-district" name="district"></div>
    <div class="field"><label for="s-memo" data-t="memo"></label><input id="s-memo" name="memo"></div>
    <div class="field"><label for="sample-in" data-t="sample_label"></label>
      <p style="margin:0;color:var(--muted);font-size:.82rem" data-t="sample_help"></p>
      <div class="sample-row"><span id="sample-status"></span><button class="btn small" type="button" id="sample-clear" hidden data-t="remove">সরান</button></div>
      <input type="file" id="sample-in" accept=".docx,.pdf,.txt"></div>
    <div style="display:flex;gap:8px"><button class="btn primary" value="save" data-t="save">Save</button><button class="btn" value="cancel" formnovalidate data-t="cancel">Cancel</button></div>
  </form>
</dialog>

<dialog id="schemes">
  <div class="sch-head">
    <div class="row"><h2 data-t="sch_title"></h2><button class="btn small" type="button" id="schemes-close" data-t="close">বন্ধ</button></div>
    <p class="sch-note" data-t="sch_note"></p>
    <input id="sch-search" type="search" aria-label="Search">
  </div>
  <div class="sch-list" id="sch-list"></div>
</dialog>

<dialog id="status">
  <div class="form">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 data-t="stat_title"></h2><button class="btn small" type="button" id="status-close" data-t="close">বন্ধ</button></div>
    <div id="status-body"></div>
  </div>
</dialog>

<script>
"use strict";
/* ---------------- storage ---------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("pmitra:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("pmitra:" + k, JSON.stringify(v)); } catch (e) { /* full or blocked */ } }
};
const DEFAULTS = { officer: "Sub-Divisional Officer", subdiv: "Sadar", district: "", memo: "SDO" };
let settings = Object.assign({}, DEFAULTS, store.get("settings", {}));
if (settings.lang !== "en") settings.lang = "bn";   // one switch: screen language = answer language
let mode = store.get("mode", "office");
let messages = store.get("chat", []);   // {role, content, shown, files, via}
let pendingFiles = [];                  // {name, kind, text?, images?: Blob[]}
let sample = null, downloads = null, imageLimits = null;
let engine = null;   // "claude" inside claude.ai, "server" on the website
let ctl = null;

const $ = s => document.querySelector(s);

/* ---------------- tiny markdown engine (shared by screen, Word, PDF, Excel) ---------------- */
function parseMd(src) {
  const L = String(src || "").replace(/\r/g, "").split("\n");
  const out = []; let para = [];
  const flush = () => { if (para.length) { out.push({ t: "p", text: para.join("\n") }); para = []; } };
  const isRow = s => /^\s*\|.*\|\s*$/.test(s);
  const isSep = s => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s);
  const cells = s => s.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
  for (let i = 0; i < L.length; i++) {
    const line = L[i];
    if (/^\s*```/.test(line)) { flush(); const buf = []; i++; while (i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]); out.push({ t: "code", text: buf.join("\n") }); continue; }
    if (!line.trim()) { flush(); continue; }
    let m;
    if ((m = line.match(/^\s*(#{1,6})\s+(.*)$/))) { flush(); out.push({ t: "h", level: m[1].length, text: m[2].replace(/\s*#+\s*$/, "") }); continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flush(); out.push({ t: "hr" }); continue; }
    if (isRow(line) && i + 1 < L.length && isSep(L[i + 1])) {
      flush(); const rows = [cells(line)]; i += 2;
      while (i < L.length && isRow(L[i])) rows.push(cells(L[i++]));
      i--; out.push({ t: "table", rows }); continue;
    }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) {
      flush(); const items = [m[1]];
      while (i + 1 < L.length && (m = L[i + 1].match(/^\s*[-*•]\s+(.*)$/))) { items.push(m[1]); i++; }
      out.push({ t: "ul", items }); continue;
    }
    if ((m = line.match(/^\s*(\d+|[০-৯]+)[.)]\s+(.*)$/))) {
      flush(); const start = parseInt(m[1].replace(/[০-৯]/g, d => "০১২৩৪৫৬৭৮৯".indexOf(d)), 10) || 1; const items = [m[2]];
      while (i + 1 < L.length && (m = L[i + 1].match(/^\s*(\d+|[০-৯]+)[.)]\s+(.*)$/))) { items.push(m[2]); i++; }
      out.push({ t: "ol", start, items }); continue;
    }
    para.push(line.replace(/\s{2,}$/, ""));
  }
  flush();
  return out;
}
/* inline: returns runs [{text, b, i, code}] */
function runs(s) {
  const out = []; const re = /(\*\*[^*]+\*\*|__[^_]+__|`[^`]+`|\*[^*\s][^*]*\*)/g; let last = 0, m;
  s = String(s);
  while ((m = re.exec(s))) {
    if (m.index > last) out.push({ text: s.slice(last, m.index) });
    const tok = m[0];
    if (tok.startsWith("**") || tok.startsWith("__")) out.push({ text: tok.slice(2, -2), b: true });
    else if (tok.startsWith("`")) out.push({ text: tok.slice(1, -1), code: true });
    else out.push({ text: tok.slice(1, -1), i: true });
    last = m.index + tok.length;
  }
  if (last < s.length) out.push({ text: s.slice(last) });
  return out;
}
const plain = s => runs(s).map(r => r.text).join("");
function inlineHtml(s) {
  return runs(s).map(r => {
    let t = esc(r.text).replace(/\n/g, "<br>");
    if (r.code) return `<code>${t}</code>`;
    if (r.b) t = `<strong>${t}</strong>`;
    if (r.i) t = `<em>${t}</em>`;
    return t;
  }).join("");
}
function mdToHtml(src) {
  return parseMd(src).map(b => {
    if (b.t === "h") return `<h${Math.min(b.level + 1, 4)}>${inlineHtml(b.text)}</h${Math.min(b.level + 1, 4)}>`;
    if (b.t === "p") return `<p>${inlineHtml(b.text)}</p>`;
    if (b.t === "hr") return "<hr>";
    if (b.t === "code") return `<pre><code>${esc(b.text)}</code></pre>`;
    if (b.t === "ul") return `<ul>${b.items.map(i => `<li>${inlineHtml(i)}</li>`).join("")}</ul>`;
    if (b.t === "ol") return `<ol start="${b.start}">${b.items.map(i => `<li>${inlineHtml(i)}</li>`).join("")}</ol>`;
    if (b.t === "table") {
      const [hd, ...rows] = b.rows;
      return `<div class="tbl"><table><thead><tr>${hd.map(c => `<th>${inlineHtml(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inlineHtml(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    return "";
  }).join("");
}

const loaded = {};
function load(name) {

/* ---------------- reading attachments ---------------- */
const MAX_DOC_CHARS = 60000;
async function readFile(f) {
  const name = f.name; const ext = (name.split(".").pop() || "").toLowerCase();
  if (f.type.startsWith("image/")) {
    if (!imageLimits) throw new Error(t("no_image_view"));
    return { name, kind: "image", images: [f] };
  }
  if (ext === "pdf") {
    await load("pdfworker"); await load("pdfjs");
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await f.arrayBuffer()) }).promise;
    let text = "";
    for (let p = 1; p <= pdf.numPages && text.length < MAX_DOC_CHARS; p++) {
      const c = await (await pdf.getPage(p)).getTextContent();
      text += `\n[Page ${p}]\n` + c.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join("");
    }
    if (text.replace(/\[Page \d+\]|\s/g, "").length > 80) return { name, kind: "pdf", text: text.slice(0, MAX_DOC_CHARS), pages: pdf.numPages };
    // scanned PDF: send page pictures instead
    if (!imageLimits) throw new Error(t("scanned_pdf"));
    const imgs = [];
    for (let p = 1; p <= Math.min(pdf.numPages, imageLimits.maxCount || 4); p++) {
      const page = await pdf.getPage(p); const vp = page.getViewport({ scale: 1.6 });
      const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      imgs.push(await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85)));
    }
    return { name, kind: "scan", images: imgs, pages: pdf.numPages };
  }
  if (ext === "docx") {
    await load("mammoth");
    const r = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() });
    return { name, kind: "docx", text: r.value.slice(0, MAX_DOC_CHARS) };
  }
  if (["xlsx", "xls", "csv"].includes(ext)) {
    await load("xlsx");
    const wb = window.XLSX.read(new Uint8Array(await f.arrayBuffer()), { type: "array" });
    const text = wb.SheetNames.map(n => `[Sheet: ${n}]\n` + window.XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n");
    return { name, kind: "sheet", text: text.slice(0, MAX_DOC_CHARS) };
  }
  if (["txt", "md"].includes(ext) || f.type.startsWith("text/")) return { name, kind: "text", text: (await f.text()).slice(0, MAX_DOC_CHARS) };
  throw new Error(t("bad_type", name));
}

const xmlEsc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function wRuns(s, extra = {}) {

    const pr = `<w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Nirmala UI"/>${(r.b || extra.b) ? "<w:b/><w:bCs/>" : ""}${r.i ? "<w:i/><w:iCs/>" : ""}<w:sz w:val="${extra.sz || 24}"/><w:szCs w:val="${extra.sz || 24}"/><w:lang w:bidi="bn-IN"/></w:rPr>`;
    return String(r.text).split("\n").map((part, k) => `<w:r>${pr}${k ? "<w:br/>" : ""}<w:t xml:space="preserve">${xmlEsc(part)}</w:t></w:r>`).join("");
  }).join("");
}
const wP = (inner, ppr = "") => `<w:p><w:pPr><w:spacing w:after="120" w:line="300" w:lineRule="auto"/>${ppr}</w:pPr>${inner}</w:p>`;
async function toDocx(md) {
  await load("jszip");
  const body = parseMd(md).map(b => {
    if (b.t === "h") return wP(wRuns(b.text, { b: true, sz: b.level === 1 ? 28 : 26 }), b.level === 1 ? '<w:jc w:val="center"/>' : "");
    if (b.t === "p") return wP(wRuns(b.text));
    if (b.t === "hr") return wP("", '<w:pBdr><w:bottom w:val="single" w:sz="4" w:space="1" w:color="999999"/></w:pBdr>');
    if (b.t === "code") return wP(wRuns(b.text));
    if (b.t === "ul" || b.t === "ol") return b.items.map((it, k) => wP(wRuns((b.t === "ol" ? (b.start + k) + ". " : "• ") + it), '<w:ind w:left="567" w:hanging="340"/>')).join("");
    if (b.t === "table") {
      const n = Math.max(...b.rows.map(r => r.length)); const w = Math.floor(9000 / n);
      const bd = ["top", "left", "bottom", "right", "insideH", "insideV"].map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="666666"/>`).join("");
      return `<w:tbl><w:tblPr><w:tblW w:w="9000" w:type="dxa"/><w:tblBorders>${bd}</w:tblBorders></w:tblPr><w:tblGrid>${`<w:gridCol w:w="${w}"/>`.repeat(n)}</w:tblGrid>` +
        b.rows.map((r, ri) => `<w:tr>${Array.from({ length: n }, (_, ci) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/></w:tcPr><w:p>${wRuns(r[ci] || "", { b: ri === 0, sz: 22 })}</w:p></w:tc>`).join("")}</w:tr>`).join("") + `</w:tbl>` + wP("");
    }
    return "";
  }).join("");
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const zip = new window.JSZip();
  zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/document.xml", doc);

}
async function toPdf(md) {

  const sheet = document.createElement("div"); sheet.className = "pdf-doc"; sheet.innerHTML = mdToHtml(md);

async function toXlsx(md) {
  await load("xlsx");
  const X = window.XLSX; const wb = X.utils.book_new();
  parseMd(md).filter(b => b.t === "table").forEach((b, k) => {
    const rows = b.rows.map(r => r.map(c => { const t = plain(c); const n = Number(t.replace(/,/g, "")); return t !== "" && /^-?[\d,]+(\.\d+)?$/.test(t) && !isNaN(n) ? n : t; }));
    const ws = X.utils.aoa_to_sheet(rows);
    ws["!cols"] = rows[0].map((_, ci) => ({ wch: Math.min(50, Math.max(8, ...rows.map(r => String(r[ci] ?? "").length + 2))) }));
    X.utils.book_append_sheet(wb, ws, "Table " + (k + 1));
  });
  return new Uint8Array(X.write(wb, { bookType: "xlsx", type: "array" }));

function fileBase(md) {
  const first = parseMd(md).find(b => b.t === "h" || b.t === "p");
  const t = first ? plain(first.text).split("\n")[0] : "draft";
  return (t.replace(/[\\/:*?"<>|#]/g, " ").replace(/\s+/g, " ").trim().slice(0, 50) || "draft");
}
const canSave = () => !!downloads || engine === "server";
async function saveFile(filename, data) {
  if (downloads) return downloads.save({ filename, data });
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function save(kind, md, btn) {
  if (!canSave()) return toast(t("no_save"));
  const label = btn.textContent; btn.disabled = true; btn.textContent = t("making");
  try {
    const data = kind === "docx" ? await toDocx(md) : kind === "pdf" ? await toPdf(md) : await toXlsx(md);
    await saveFile(`${fileBase(md)}.${kind}`, data);
    toast(t("file_ready"));
  } catch (e) {
    if (e && e.code === "declined") toast(t("dl_cancel"));
    else if (e && e.code === "rate_limited") toast(t("dl_wait"));
    else toast((e && e.message) || t("dl_fail"));
  } finally { btn.disabled = false; btn.textContent = label; }
}

/* website: our own /api/chat, which tries the free AI providers in turn */
async function serverAsk(system, turns, imgs, { signal, onText }) {
  const images = [];
  for (const b of imgs.slice(0, 4)) images.push({ mime: b.type || "image/jpeg", data: await toB64(b) });
  let res;
  try {
    res = await fetch("api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ system, messages: turns, images }), signal });
  } catch (e) { throw { code: signal && signal.aborted ? "cancelled" : "upstream_error" }; }
  if (!res.ok) {
    const j = await res.json().catch(() => ({}));
    throw { code: res.status === 429 ? "rate_limited" : res.status === 413 ? "prompt_too_large" : j.error === "not_configured" ? "server_unconfigured" : j.error === "no_vision" ? "images_unavailable" : res.status === 502 ? "all_failed" : "upstream_error" };
  }
  const via = (res.headers.get("x-ai-provider") || "").split("/")[0];
  const reader = res.body.getReader(); const dec = new TextDecoder(); let text = "";
  const clean = s => s.replace(/\u0000[A-Z_]+\s*$/, "");
  try {
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      text += dec.decode(value, { stream: true });
      const shown = clean(text);
      if (shown.trim()) onText({ text: shown });
    }
  } catch (e) { throw { code: signal && signal.aborted ? "cancelled" : "upstream_error", text: clean(text) }; }
  const flag = (text.match(/\u0000([A-Z_]+)\s*$/) || [])[1];
  text = clean(text);
  if (!text.trim()) throw { code: "empty_completion" };
  return { text, truncated: flag === "MAX_TOKENS" || flag === "CUT", via };
}

const CLIENT_TIMEOUT_MS = 150000;
async function ask(text) {
  if (!engine) return toast(t("no_ai"));
  const files = pendingFiles; pendingFiles = [];
  let content = text;
  const docs = files.filter(f => f.text);
  if (docs.length) content += "\n\n" + docs.map(f => `--- Attached file: ${f.name} ---\n${f.text}\n--- End of ${f.name} ---`).join("\n\n");
  const imgs = files.flatMap(f => f.images || []);
  if (imgs.length) content += `\n\n(${imgs.length} image(s) attached: ${files.filter(f => f.images).map(f => f.name + (f.kind === "scan" ? " — scanned PDF pages" : "")).join(", ")}. Read them carefully, including Bengali text.)`;
  messages.push({ role: "user", content, shown: text, files: files.map(f => f.name), done: true });
  const ai = { role: "assistant", content: "", done: false, started: Date.now() };
  messages.push(ai);
  render(); scrollDown(); setBusy(true);

  let turns = messages.slice(0, -1).filter(m => m.content && (m.role === "user" || m.done)).map(m => ({ role: m.role, content: m.content }));
  while (turns.length > 1 && JSON.stringify(turns).length > 180000) turns.shift();
  while (turns.length && turns[0].role !== "user") turns.shift();
  const input = [{ role: "user", content: rules() }, ...turns];

  ctl = new AbortController();
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; ctl.abort(); }, CLIENT_TIMEOUT_MS);
  try {
    const opts = { cache: false, signal: ctl.signal, onText: ({ text }) => { ai.content = text; updateLast(); } };
    if (imgs.length) opts.images = imgs.slice(0, (imageLimits && imageLimits.maxCount) || 4);
    const r = engine === "claude" ? await sample(input, opts) : await serverAsk(rules(), turns, imgs, opts);
    ai.content = r.text; ai.via = r.via || (engine === "claude" ? "claude" : "");
    if (r.truncated) ai.error = errText("cut");
  } catch (e) {
    const code = e && e.code;
    ai.content = code === "refused" ? "" : ((e && e.text) || ai.content);
    if (code === "cancelled" && timedOut) ai.error = errText("timeout");
    else if (code !== "cancelled") ai.error = errText(code);
    if (code === "server_unconfigured") showBanner(errText(code));
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) showBanner(errText(code === "not_granted" ? code : "sampling_disabled"));
    if (!ai.content && code === "cancelled" && !timedOut) ai.content = t("stopped");
  } finally {
    clearTimeout(timer);
    ai.done = true; ctl = null; setBusy(false); updateLast(); persist();
  }
}

  try {
    const r = await (await fetch("api/chat?test=1", { cache: "no-store" })).json();
    if (!r.results || !r.results.length) { body.innerHTML = `<p>${esc(t("stat_none"))}</p>`; return; }
    body.innerHTML = `<div class="tbl"><table><thead><tr><th>${esc(t("th_ai"))}</th><th>${esc(t("th_model"))}</th><th>${esc(t("th_res"))}</th><th>${esc(t("th_time"))}</th><th>${esc(t("th_why"))}</th></tr></thead><tbody>${
      r.results.map(x => `<tr><td>${esc(PROVIDER_NAMES[x.provider] || x.provider)}</td><td>${esc(x.model)}</td><td><span class="pill ${x.ok ? "ok" : "unc"}">${esc(t(x.ok ? "stat_ok" : "stat_fail"))}</span></td><td>${(x.ms / 1000).toFixed(1)}s</td><td class="err">${esc(x.ok ? "" : `${x.status || ""} ${x.error || ""}`.trim())}</td></tr>`).join("")
    }</tbody></table></div><p class="sch-note">${esc(t("stat_help"))}</p>`;
  } catch (e) { body.innerHTML = `<p>${esc(t("stat_err"))}</p>`; }
}

/* ---------------- menu drawer (phones) ---------------- */
const openMenu = () => document.body.classList.add("rail-open");
const closeMenu = () => document.body.classList.remove("rail-open");

/* ---------------- events ---------------- */
const q = $("#q");
const autosize = () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 200) + "px"; };
q.addEventListener("input", autosize);
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#ask").requestSubmit(); } });
$("#ask").addEventListener("submit", e => {
  e.preventDefault();
  if (ctl) { ctl.abort(); return; }
  const text = q.value.trim();
  if (!text && !pendingFiles.length) return;
  q.value = ""; autosize();
  ask(text || t("file_default"));
});
$("#attach").addEventListener("click", () => $("#file-in").click());
$("#file-in").addEventListener("change", async e => {
  const list = Array.from(e.target.files || []); e.target.value = "";
  for (const f of list) {
    toast(`${f.name} ${t("reading")}`);
    try { pendingFiles.push(await readFile(f)); renderPending(); }
    catch (err) { toast(err.message || t("dl_fail")); }
  }
});
$("#sch-search").addEventListener("input", renderSchemes);
document.addEventListener("click", e => {
  const tk = e.target.closest("[data-task]");
  if (tk) { closeMenu(); q.value = tasks()[+tk.dataset.task][2]; autosize(); q.focus(); q.setSelectionRange(q.value.length, q.value.length); return; }
  const sc = e.target.closest("[data-scheme]");
  if (sc) { closeMenu(); $("#sch-search").value = ""; renderSchemes(); $("#schemes").showModal(); const card = $("#sch-list").children[+sc.dataset.scheme]; if (card) card.scrollIntoView({ block: "center" }); return; }
  const as = e.target.closest("[data-ask-scheme]");
  if (as) { $("#schemes").close(); if (mode !== "public" && !messages.length) { mode = "public"; store.set("mode", mode); render(); } ask(t("ask_scheme", SCHEME_DATA[+as.dataset.askScheme][settings.lang].n)); return; }
  if (e.target.closest("[data-open-schemes], #open-schemes, #open-schemes2")) return openSchemes();
  if (e.target.closest("#schemes-close")) return $("#schemes").close();
  if (e.target.closest("#open-status")) return openStatus();
  if (e.target.closest("#status-close")) return $("#status").close();
  if (e.target.closest("#menu")) return openMenu();
  if (e.target.closest("#rail-close, #scrim")) return closeMenu();
  const un = e.target.closest("[data-unpend]"); if (un) { pendingFiles.splice(+un.dataset.unpend, 1); renderPending(); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const k = +a.closest(".msg").dataset.k; const m = messages[k]; const act = a.dataset.act;
    if (act === "copy") navigator.clipboard.writeText(m.content).then(() => toast(t("copied")), () => toast(t("copy_fail")));
    else if (act === "edit") { m.editing = true; updateAt(k); const ta = $(`#edit-${k}`); if (ta) ta.focus(); }
    else if (act === "edit-save") { m.content = $(`#edit-${k}`).value; m.editing = false; updateAt(k); persist(); toast(t("saved_edit")); }
    else save(act, m.content, a);
    return;
  }
  if (e.target.closest("#mode-office")) { mode = "office"; store.set("mode", mode); render(); }
  if (e.target.closest("#mode-public")) { mode = "public"; store.set("mode", mode); render(); }
  if (e.target.closest("#lang-bn, #lang-en")) { settings.lang = e.target.closest("#lang-en") ? "en" : "bn"; store.set("settings", settings); applyLang(); render(); }
  if (e.target.closest("#new-chat")) { if (ctl) ctl.abort(); messages = []; pendingFiles = []; persist(); render(); }
  if (e.target.closest("#open-settings, #open-settings2")) {
    closeMenu();
    const f = $("#settings-form"); Object.keys(DEFAULTS).forEach(k => { f.elements[k].value = settings[k]; }); showSample(); $("#settings").showModal();
  }
  if (e.target.closest("#sample-clear")) { delete settings.sampleName; delete settings.sampleText; store.set("settings", settings); showSample(); render(); toast(t("sample_removed")); }
});
function showSample() {
  $("#sample-status").textContent = settings.sampleText ? t("format_on") + settings.sampleName : t("none_sample");
  $("#sample-clear").hidden = !settings.sampleText;
}
$("#sample-in").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const r = await readFile(f);
    if (!r.text || !r.text.trim()) throw new Error(t("sample_bad"));
    settings.sampleName = f.name; settings.sampleText = r.text.replace(/\[Page \d+\]\n?/g, "").trim().slice(0, 6000);
    store.set("settings", settings); showSample(); render(); toast(t("sample_saved"));
  } catch (err) { toast(err.message || t("sample_bad")); }
});
$("#settings").addEventListener("close", () => {
  if ($("#settings").returnValue !== "save") return;
  const f = $("#settings-form"); Object.keys(DEFAULTS).forEach(k => { settings[k] = f.elements[k].value.trim() || DEFAULTS[k]; });
  store.set("settings", settings); toast(t("settings_saved"));
});

/* ---------------- start ---------------- */
messages.forEach(m => { m.done = true; m.editing = false; });
if (OWNER_NOTICE) { const n = $("#owner-notice"); n.textContent = OWNER_NOTICE; n.hidden = false; }
applyLang(); render(); scrollDown();
(async () => {
  if (!window.claude || !window.claude.use) {
    // website build: AI runs through our own server
    engine = "server"; imageLimits = { maxCount: 4 };
    $("#engine-note").textContent = " · Gemini, Llama, Kimi, Mistral +";
    try { const h = await (await fetch("api/chat", { cache: "no-store" })).json(); if (!h.configured) showBanner(errText("server_unconfigured")); }
    catch (e) { showBanner(t("unreachable")); }
    render(); scrollDown(); return;
  }
  const [s, d] = await Promise.all([window.claude.use("sample").catch(() => null), window.claude.use("downloads").catch(() => null)]);
  sample = s; downloads = d;
  if (sample) { engine = "claude"; try { const lim = await sample.limits(); imageLimits = lim.images || null; } catch (e) { imageLimits = null; } }
  else showBanner(t("no_ai_claude"));
  render(); scrollDown();
})();
</script>
</body>
</html>
