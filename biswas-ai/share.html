<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Shared files · Biswas AI</title>
<style>
:root { --bg: #f6f7fb; --card: #fff; --ink: #1d2433; --mute: #667085; --line: #e3e7ef; --acc: #2457d6; --bad: #b42318; --ok: #067647; }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 system-ui, "Noto Sans Bengali", "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: var(--card); border-bottom: 1px solid var(--line); }
header b { font-size: 17px; } header .sp { flex: 1; }
main { max-width: 1180px; margin: 18px auto; padding: 0 14px; display: grid; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit; color: inherit; }
.btn.primary { background: var(--acc); color: #fff; border-color: var(--acc); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
input[type=password], input[type=text], textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; width: 100%; }
.msg { padding: 12px 14px; border-radius: 10px; background: #fff4e5; border: 1px solid #f5d39b; }
.msg.bad { background: #fef3f2; border-color: #fecdca; color: var(--bad); }
.split { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 14px; align-items: start; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.tree { list-style: none; margin: 0; padding: 0; }
.tree ul { list-style: none; margin: 0; padding-left: 18px; }
.tree li > div { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; }
.tree li > div:hover { background: #f2f4f8; }
.tree li > div.on { background: #e8efff; }
.tree .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.tree .sz { color: var(--mute); font-size: 12px; white-space: nowrap; }
.tree .dir > .nm { font-weight: 600; }
.tree li.shut > ul { display: none; }
#pv { min-height: 420px; }
#pv iframe, #pv video { width: 100%; height: 72vh; border: 0; border-radius: 8px; background: #f2f4f8; }
#pv img { max-width: 100%; max-height: 72vh; display: block; margin: auto; }
#pv pre { white-space: pre-wrap; word-break: break-word; max-height: 72vh; overflow: auto; background: #f8f9fc; padding: 12px; border-radius: 8px; font: 13px/1.45 ui-monospace, Consolas, monospace; }
#pv .doc { max-height: 72vh; overflow: auto; padding: 4px 8px; }
#pv table { border-collapse: collapse; font-size: 13px; } #pv td, #pv th { border: 1px solid var(--line); padding: 3px 7px; }
#pv mark { background: #ffe58a; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.bar { height: 8px; background: #eef1f6; border-radius: 6px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--acc); width: 0; }
.ups { display: grid; gap: 8px; margin-top: 10px; } .ups .row { display: grid; grid-template-columns: 1fr 120px 90px; gap: 8px; align-items: center; font-size: 14px; }
.drop { border: 2px dashed var(--line); border-radius: 12px; padding: 26px; text-align: center; color: var(--mute); }
.drop.over { border-color: var(--acc); background: #f0f4ff; }
.ai-ans { white-space: pre-wrap; margin-top: 10px; } .chip { display: inline-block; font-size: 12px; background: #e8efff; color: var(--acc); border-radius: 10px; padding: 0 7px; margin: 0 2px; cursor: pointer; border: 0; }
.mute { color: var(--mute); font-size: 13px; }
</style>
</head>
<body>
<header><b id="h-title">📁</b><span class="sp"></span><button class="btn small" type="button" id="lang">English</button></header>
<main id="app"><div class="card mute" id="boot">…</div></main>
<script src="/pd-zip.js"></script>
<script src="/share.js"></script>
</body>
</html>
