# Render Blueprint: one-click free hosting for Biswas AI for Office.
# Render asks for the API keys (sync: false) when you create the service.
services:
  - type: web
    name: biswas-ai-for-office
    runtime: node
    plan: free
    rootDir: biswas-ai
    buildCommand: echo "no build needed"
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # Only keys the code reads. Z.ai also accepts the older name Z_AI.
    # Other providers in api/chat.js (sambanova, cerebras, sarvam, ...) still work if you add their key.
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LLM7_API_KEY
        sync: false
      - key: NARA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
      - key: KEIRO_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # AI Pendrive (Cloudflare R2). Optional: PENDRIVE_QUOTA_BYTES (default 2 GB per pendrive).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: PENDRIVE_SECRET
        sync: false
